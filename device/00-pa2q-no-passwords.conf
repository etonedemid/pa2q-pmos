# Install to /etc/ssh/sshd_config.d/. sshd keeps the first value it reads, so
# the 00- prefix makes this win over any later drop-in or sshd_config line.
#
# OpenSSH before 10.6p2 on musl without PAM accepts any 257-1024 byte password
# for an account whose shadow password field is "*".
# https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/
PasswordAuthentication no
