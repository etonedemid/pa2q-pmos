# pa2q (Galaxy S25+) audio policy for WirePlumber.
wireplumber.profiles = {
  main = {
    # The V4L2/libcamera monitors hang in monitor/v4l2/create-device on this
    # phone's camera nodes (open fails with ENOMEM), which wedges WirePlumber's
    # event dispatcher: no stream ever gets linked. Cameras don't work here anyway.
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}

# The kernel card's PCMs are DSP backends (no DMA; agm_server drives them).
# Don't let ACP probe/open them - audio goes through the "pa2q_speaker" sink.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-soc_spf_core_platform_sound" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
