# pa2q: loudspeakers. The sink writes raw S16LE/48k/stereo into a FIFO that
# pa2q-speaker-bridge (root) feeds to the vendor agmplay - the native
# agm_server path ("agm:100,100") runs the graph but stays silent.
# Install: /etc/pipewire/pipewire.conf.d/
context.modules = [
    {   name = libpipewire-module-pipe-tunnel
        args = {
            tunnel.mode    = sink
            pipe.filename  = "/run/pa2q-speaker.fifo"
            audio.format   = S16LE
            audio.rate     = 48000
            audio.channels = 2
            audio.position = [ FL FR ]
            stream.props = {
                node.name        = "pa2q_speaker"
                node.description = "Speaker"
                priority.driver  = 2000
                priority.session = 2000
                # Never suspend: agmplay starved of data for a while stays
                # silent afterwards, so feed it silence while idle.
                # ponytail: keeps the DSP graph + amp on; restart agmplay per
                # stream instead if idle power matters.
                node.always-process              = true
                node.pause-on-idle               = false
                session.suspend-timeout-seconds  = 0
            }
        }
    }
]
